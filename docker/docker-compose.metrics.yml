# This override adds the following to the self-hosted Supabase configuration:
#   - Prometheus: metrics collection and storage, the data source for the
#     dashboard's compute usage and request charts
#   - Node Exporter: host CPU, memory, disk, and network metrics
#   - Postgres Exporter: database connection, size, and WAL metrics
#
# Studio queries Prometheus server-side only, so no port is published to the
# host: everything stays on the compose network.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.metrics.yml up -d
#
# Or, to persist it in .env:
#   sh run.sh config add metrics
#   sh run.sh start
#
# When the Kong gateway override (docker-compose.kong.yml) is active, point
# Studio at Kong's metrics instead of Envoy's by adding to the studio service:
#
#   studio:
#     environment:
#       METRICS_GATEWAY: kong
#
# and switch the `gateway` scrape job in ./volumes/metrics/prometheus.yml to
# the commented Kong target.

services:

  studio:
    environment:
      METRICS_PROMETHEUS_URL: http://prometheus:9090
      METRICS_GATEWAY: envoy

  prometheus:
    container_name: supabase-prometheus
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    # Not published to the host: only Studio reads Prometheus, over the
    # compose network.
    #ports:
    #  - 9090:9090
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy"
        ]
      timeout: 5s
      interval: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ./volumes/metrics/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - prometheus-data:/prometheus
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.path=/prometheus",
        # 15 days covers the dashboard's longest chart range (7 days).
        "--storage.tsdb.retention.time=15d"
      ]

  node-exporter:
    container_name: supabase-node-exporter
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    # Host metrics are read from a read-only bind mount of `/`; the Docker
    # socket is never used.
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      [
        "--path.rootfs=/host"
      ]

  postgres-exporter:
    container_name: supabase-postgres-exporter
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    depends_on:
      db:
        # Disable this if you are using an external Postgres database
        condition: service_healthy
    volumes:
      - ./volumes/metrics/postgres-exporter-queries.yaml:/etc/postgres-exporter/queries.yaml:ro,z
    environment:
      DATA_SOURCE_NAME: postgresql://supabase_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/postgres?sslmode=disable
    command:
      [
        # Deprecated but still supported: adds the custom pg_wal_size_bytes
        # metric on top of the built-in collectors.
        "--extend.query-path=/etc/postgres-exporter/queries.yaml"
      ]

volumes:
  prometheus-data:
