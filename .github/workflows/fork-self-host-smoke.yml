# Fork-only smoke test for the self-hosted docker-compose stack. Starts the
# default configuration with the fork's Studio image and runs the upstream
# smoke tests against it.
name: Fork Self-Host Smoke

on:
  pull_request:
    paths:
      - 'docker/**'
      - '.github/workflows/fork-self-host-smoke.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Default configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: |
            docker/

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Generate keys
        shell: bash
        run: |
          set -euo pipefail
          cd docker
          cp .env.example .env
          sh utils/generate-keys.sh --update-env
          sh utils/add-new-auth-keys.sh --update-env

      - name: Start self-hosted Supabase
        shell: bash
        run: |
          set -euo pipefail
          cd docker
          yq -i '.services.supavisor.environment.RLIMIT_NOFILE=1024' docker-compose.yml
          docker compose up --quiet-pull --wait --wait-timeout 180

      - name: Check service health endpoint
        shell: bash
        run: |
          set -euo pipefail
          cd docker
          docker compose exec -T studio node -e "
            fetch('http://localhost:3000/api/platform/projects/default/self-hosted/service-health')
              .then(async (r) => {
                const body = await r.json()
                console.log(JSON.stringify(body, null, 2))
                if (r.status !== 200) throw new Error('HTTP ' + r.status)
                const unhealthy = body.services.filter((s) => s.status === 'UNHEALTHY')
                if (unhealthy.length > 0) throw new Error('Unhealthy: ' + unhealthy.map((s) => s.name).join(', '))
              })
          "

      - name: Run container log tests
        shell: bash
        run: |
          set -euo pipefail
          cd docker
          sh tests/test-container-logs.sh

      - name: Run smoke tests
        shell: bash
        run: |
          set -euo pipefail
          cd docker
          sh tests/test-self-hosted.sh

      - name: Run API keys and asymmetric auth tests
        shell: bash
        run: |
          set -euo pipefail
          cd docker
          sh tests/test-auth-keys.sh

      - name: Show logs on failure
        if: failure()
        shell: bash
        run: |
          cd docker
          docker compose ps
          docker compose logs --tail 100 studio rest meta
