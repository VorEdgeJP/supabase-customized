# Fork-only workflow: builds the customized Studio image and publishes it to GHCR.
#
# Triggers:
#   - a git tag `studio-v<version>` (e.g. studio-v2026.09.02) publishes `<version>`, `sha-<short>` and `latest`
#   - workflow_dispatch builds any ref and publishes `<version>` and `sha-<short>` only
name: Fork Studio Image

on:
  push:
    tags:
      - 'studio-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to publish (e.g. 2026.09.02). Defaults to the current date.'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/supabase-customized-studio

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve tags
        id: tags
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=7 HEAD)"
          if [[ "${GITHUB_REF}" == refs/tags/studio-v* ]]; then
            version="${GITHUB_REF#refs/tags/studio-v}"
            is_release=true
          else
            version="${INPUT_VERSION:-$(date -u +%Y.%m.%d)}"
            is_release=false
          fi
          image="${IMAGE_NAME,,}"
          tags="${image}:${version}"$'\n'"${image}:sha-${short_sha}"
          if [[ "${is_release}" == "true" ]]; then
            tags="${tags}"$'\n'"${image}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/studio/Dockerfile
          target: production
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_STUDIO_AUTH_MODE=supabase
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          {
            echo "## Published tags"
            echo
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
